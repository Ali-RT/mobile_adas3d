base_config: kitti_mnv4_axis_direction_v5.yaml

dataset:
  classes: [Vehicle, Pedestrian]
  class_mapping:
    Car: Vehicle
    Van: Vehicle
    Truck: Vehicle
    Tram: Vehicle
    Pedestrian: Pedestrian
    Person_sitting: Pedestrian
  require_taxonomy_manifest: true
  taxonomy_manifest: ./outputs/manifests/kitti_s1_taxonomy_manifest.json
  taxonomy_manifest_paths:
    colab_drive: /content/drive/MyDrive/mobile_adas3d_manifests/kitti_s1_taxonomy_manifest.json

logging:
  run_name: "mobileadas3d_s1_pretraining_gate"

model:
  name: "MobileADAS3D-S1"
  backbone: "mobilenetv4_conv_small.e2400_r224_in1k"
  pretrained: true
  normalize_imagenet: true
  input_height: 384
  input_width: 1280
  output_stride: 8
  neck: "stride8_lite_fpn"
  fpn_channels: 96
  head_channels: 96
  use_projected_center: true
  use_quality: true
  use_yaw_axis_direction: true
  location_source: "projected_center"
  score_mode: "class_quality"
  heads:
    cls_logits: true
    quality: true
    box2d: true
    projected_center_offset: true
    log_depth: true
    depth_uncertainty: true
    dim: true
    yaw_axis: true
    yaw_direction: true
    loc_xy: true

targets:
  class_mean_dims:
    # Train-split-only means from the audited Chen taxonomy manifest.
    Vehicle: [1.663947, 1.681781, 4.309594]
    Pedestrian: [1.755652, 0.625749, 0.824048]

loss:
  class_weights:
    Vehicle: 1.0
    Pedestrian: 2.5

distillation:
  enabled: false
