project_name: mobile_adas3d

dataset:
  name: kitti

  # Default for local debugging.
  # In Colab, override with:
  #   --profile colab_drive
  active_profile: local_mac

  profiles:
    local_mac:
      root_dir: ./datasets/kitti

    colab_drive:
      root_dir: /content/drive/MyDrive/datasets/kitti

  image_dir: training/image_2
  label_dir: training/label_2
  calib_dir: training/calib

  classes:
    - Car
    - Pedestrian
    - Cyclist

  splits:
    split_dir: /content/drive/MyDrive/mobile_adas3d_splits/kitti
    train_file: train.txt
    val_file: val.txt
    test_file: test.txt
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

model:
  name: MobileADAS3D
  backbone: mobilenet_v3_small
  pretrained: true
  input_height: 384
  input_width: 1280

  # New version
  output_stride: 16
  neck: stride16_fpn
  box_encoding: ltrb

  fpn_channels: 128
  head_channels: 256
  use_sparse_depth: false

targets:
  center_sampling:
    enabled: true
    radius: 1

  class_mean_dims:
    Car: [1.50, 1.60, 3.90]
    Pedestrian: [1.70, 0.60, 0.80]
    Cyclist: [1.70, 0.60, 1.76]

training:
  seed: 42
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 80
  device: auto
  log_interval: 20
  save_interval: 1
  use_amp: true
  gradient_clip_norm: 5.0

scheduler:
  name: ReduceLROnPlateau
  enabled: true
  monitor_metric: val_total_loss
  mode: min
  factor: 0.5
  patience: 4
  threshold: 0.0005
  threshold_mode: rel
  cooldown: 1
  min_lr: 0.000001

early_stopping:
  enabled: true
  monitor_metric: val_total_loss
  mode: min
  patience: 12
  min_delta: 0.0005
  start_epoch: 10

validation:
  enabled: true
  batch_size: 8
  num_workers: 2
  interval_epochs: 1
  monitor_metric: val_total_loss
  mode: min

loss:
  cls_weight: 1.0
  box2d_weight: 2.0
  depth_weight: 1.0
  depth_uncertainty_weight: 0.0
  dim_weight: 1.0
  yaw_weight: 1.0
  offset_weight: 0.5

  class_weights:
    Car: 1.0
    Pedestrian: 2.5
    Cyclist: 3.0
    
logging:
  run_name: baseline_mobilenetv3_kitti
  use_tensorboard: true
  save_config_snapshot: true
  save_jsonl: true
  save_csv: true
  
  
outputs:
  # Local default.
  output_dir: ./outputs

  # For Colab, override automatically when --profile colab_drive is used.
  profile_output_dirs:
    local_mac: ./outputs
    colab_drive: /content/drive/MyDrive/mobile_adas3d_outputs

inference:
  score_threshold: 0.55
  topk: 50
  eval_topk: 100
  nms_iou_threshold: 0.5