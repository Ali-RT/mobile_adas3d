project_name: mobile_adas3d

dataset:
  name: kitti

  # Default for local debugging.
  # In Colab, override with:
  #   --profile colab_drive
  active_profile: colab_drive

  profiles:
    local_mac:
      root_dir: ./datasets/kitti

    colab_drive:
      root_dir: /content/drive/MyDrive/datasets/kitti

  image_dir: training/image_2
  label_dir: training/label_2
  calib_dir: training/calib

  classes:
    - Car
    - Pedestrian
    - Cyclist

  splits:
    split_dir: /content/drive/MyDrive/mobile_adas3d_splits/kitti
    train_file: train.txt
    val_file: val.txt
    test_file: test.txt
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

logging:
  run_name: "v7_stride16_fpn_cuboid_location"

model:
  name: "MobileADAS3D"
  backbone: "mobilenet_v3_small"
  pretrained: true
  input_height: 384
  input_width: 1280
  output_stride: 16
  neck: "stride16_fpn"
  box_encoding: "log_ltrb_stride"
  fpn_channels: 128
  head_channels: 256
  use_sparse_depth: false

  heads:
    cls_logits: true
    box2d: true
    log_depth: true
    dim: true
    yaw: true
    center_offset: true
    depth_uncertainty: true
    loc_xy: true

targets:
  center_sampling:
    enabled: true
    radius: 1

  box_encoding: "log_ltrb_stride"
  depth_encoding: "log_z"
  location_encoding: "xy_over_z"
  dim_encoding: "log_class_ratio"
  yaw_encoding: "sin_cos"

  class_mean_dims:
    Car: [1.50, 1.60, 3.90]
    Pedestrian: [1.70, 0.60, 0.80]
    Cyclist: [1.70, 0.60, 1.76]

loss:
  cls_weight: 1.0
  box2d_weight: 2.0
  depth_weight: 1.0
  loc_xy_weight: 1.0
  dim_weight: 1.0
  yaw_weight: 1.0
  offset_weight: 0.5
  depth_uncertainty_weight: 0.0

  # New cuboid consistency loss.
  corner3d_weight: 0.25

  class_weights:
    Car: 1.0
    Pedestrian: 2.5
    Cyclist: 3.0

training:
  seed: 42
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 80
  device: "auto"
  log_interval: 20
  save_interval: 1
  use_amp: true
  gradient_clip_norm: 5.0

scheduler:
  name: ReduceLROnPlateau
  enabled: true
  monitor_metric: val_total_loss
  mode: min
  factor: 0.5
  patience: 4
  threshold: 0.0005
  threshold_mode: rel
  cooldown: 1
  min_lr: 0.000001

early_stopping:
  enabled: true
  monitor_metric: val_total_loss
  mode: min
  patience: 12
  min_delta: 0.0005
  start_epoch: 10

validation:
  enabled: true
  batch_size: 8
  num_workers: 2
  interval_epochs: 1
  monitor_metric: val_total_loss
  mode: min


  
outputs:
  # Local default.
  output_dir: ./outputs

  # For Colab, override automatically when --profile colab_drive is used.
  profile_output_dirs:
    local_mac: ./outputs
    colab_drive: /content/drive/MyDrive/mobile_adas3d_outputs

inference:
  score_threshold: 0.55
  topk: 50
  eval_topk: 100
  nms_iou_threshold: 0.5