project_name: mobile_adas3d

dataset:
  name: kitti

  # Use colab_localdisk after copying KITTI from Drive to /content.
  active_profile: colab_localdisk

  profiles:
    local_mac:
      root_dir: ./datasets/kitti

    colab_drive:
      root_dir: /content/drive/MyDrive/datasets/kitti

    colab_localdisk:
      root_dir: /content/datasets/kitti

  image_dir: training/image_2
  label_dir: training/label_2
  calib_dir: training/calib

  classes:
    - Car
    - Pedestrian
    - Cyclist

  splits:
    split_dir: /content/drive/MyDrive/mobile_adas3d_splits/kitti
    train_file: train.txt
    val_file: val.txt
    test_file: test.txt
    seed: 42
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

colab_data:
  drive_root_dir: /content/drive/MyDrive/datasets/kitti
  local_root_dir: /content/datasets/kitti
  required_subdirs:
    - training/image_2
    - training/label_2
    - training/calib
    
model:
  name: MobileADAS3D
  backbone: mobilenet_v3_small
  pretrained: true
  input_height: 384
  input_width: 1280
  output_stride: 32
  use_sparse_depth: false

targets:
  class_mean_dims:
    Car: [1.50, 1.60, 3.90]
    Pedestrian: [1.70, 0.60, 0.80]
    Cyclist: [1.70, 0.60, 1.76]

training:
  batch_size: 8
  num_workers: 2
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 20
  device: cuda
  log_interval: 20
  save_interval: 1

outputs:
  output_dir: /content/drive/MyDrive/mobile_adas3d_outputs
  checkpoint_dir: /content/drive/MyDrive/mobile_adas3d_outputs/checkpoints
  log_dir: /content/drive/MyDrive/mobile_adas3d_outputs/logs
  visualization_dir: /content/drive/MyDrive/mobile_adas3d_outputs/visualizations